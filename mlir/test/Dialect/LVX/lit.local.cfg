# -*- Python -*-
#
# `emit-asm.mlir` is also an integration test: it pipes the emitted assembly
# into the *real* `lvx-mbr-as` built from the sibling `lvx-binutils` repo.  That
# assembler lives outside this checkout, at an absolute path that differs per
# machine, so discover it here and expose it as `%lvx_mbr_as` rather than
# hardcoding a path in a RUN line.  Tests wrap the RUN lines that need it in
# `%if lvx-mbr-as %{ ... %}`, so the rest of the file still runs where the LVX
# toolchain is not installed.

import os
import shutil


def _find_lvx_mbr_as():
    # 1. Explicit override, for a toolchain installed somewhere unusual.
    #    LVX_TOOLCHAIN_BIN names the directory holding the lvx-mbr-* binaries.
    #    It is exclusive: if it is set but holds no assembler, report none
    #    rather than quietly assembling against some *other* toolchain.
    env = os.environ.get("LVX_TOOLCHAIN_BIN")
    if env:
        cand = os.path.join(env, "lvx-mbr-as")
        return cand if os.access(cand, os.X_OK) else None

    # 2. The default layout: this llvm-project is the `llvm-project` submodule
    #    of `lvx-mlir`, itself a submodule of the `lvx-csw` superproject, which
    #    holds the installed `lvx-toolchain/` beside it.  From
    #    <csw>/lvx-mlir/llvm-project/mlir that is three levels up.
    cand = os.path.normpath(
        os.path.join(
            config.mlir_src_root, "..", "..", "..", "lvx-toolchain", "bin", "lvx-mbr-as"
        )
    )
    if os.access(cand, os.X_OK):
        return cand

    # 3. Anything on PATH.
    return shutil.which("lvx-mbr-as")


lvx_mbr_as = _find_lvx_mbr_as()
if lvx_mbr_as:
    config.available_features.add("lvx-mbr-as")
    config.substitutions.append(("%lvx_mbr_as", lvx_mbr_as))
